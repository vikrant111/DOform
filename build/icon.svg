<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4a78"/>
      <stop offset="1" stop-color="#0f2d4b"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0b55c"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06182b" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="26" y="26" width="972" height="972" rx="206" fill="none"
        stroke="url(#brass)" stroke-width="12" opacity="0.85"/>

  <!-- lanyard clip, so the mark reads as a worn pass -->
  <rect x="470" y="150" width="84" height="40" rx="16" fill="url(#brass)"/>
  <rect x="496" y="182" width="32" height="54" fill="#0f2d4b" opacity="0.6"/>

  <!-- the pass itself -->
  <g filter="url(#drop)">
    <rect x="232" y="226" width="560" height="620" rx="54" fill="#ffffff"/>
    <path d="M232 280a54 54 0 0 1 54-54h452a54 54 0 0 1 54 54v86H232z" fill="url(#brass)"/>

    <!-- photo -->
    <circle cx="380" cy="508" r="86" fill="#d9e2ec"/>
    <circle cx="380" cy="478" r="34" fill="#14395e"/>
    <path d="M316 566a64 64 0 0 1 128 0z" fill="#14395e"/>

    <!-- detail lines -->
    <rect x="496" y="452" width="214" height="26" rx="13" fill="#14395e"/>
    <rect x="496" y="500" width="160" height="22" rx="11" fill="#c3ced9"/>
    <rect x="496" y="540" width="186" height="22" rx="11" fill="#c3ced9"/>

    <rect x="296" y="662" width="432" height="22" rx="11" fill="#dbe3ea"/>
    <rect x="296" y="710" width="330" height="22" rx="11" fill="#dbe3ea"/>

    <!-- brass footer rule -->
    <rect x="296" y="776" width="432" height="14" rx="7" fill="url(#brass)"/>
  </g>
</svg>
